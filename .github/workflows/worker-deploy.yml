name: Deploy EDGE Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.js"
      - "domain.js"
      - "au-sources.js"
      - "datacedar.js"
      - "crypto-engine.js"
      - "coinspot.js"
      - "coinspot-paper.js"
      - "coinspot-strategy.js"
      - "live-execution-guard.js"
      - "coinspot-live.js"
      - "coinspot-execution-coordinator.js"
      - "wrangler.toml"
      - "package.json"
      - "tests/**"
      - ".github/workflows/worker-deploy.yml"

permissions:
  contents: read

concurrency:
  group: edge-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate application
        run: |
          npm test
          npm run check

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Provision or reuse production KV namespace
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3d6d1c93342d0a22c108dee320c2bf6e
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error('Cloudflare API token or account ID is missing.');
          const headers = {
            Authorization: 'Bearer ' + token,
            'Content-Type': 'application/json'
          };
          async function api(path, options = {}) {
            const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) }
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) {
              const messages = (body.errors || []).map(error => error.message).filter(Boolean);
              throw new Error('Cloudflare API ' + response.status + ': ' + (messages.join('; ') || response.statusText));
            }
            return body;
          }
          (async () => {
            const base = '/accounts/' + account + '/storage/kv/namespaces';
            const listed = await api(base);
            let namespace = (listed.result || []).find(item => item.title === 'EDGE_KV');
            if (!namespace) {
              const created = await api(base, {
                method: 'POST',
                body: JSON.stringify({ title: 'EDGE_KV' })
              });
              namespace = created.result;
            }
            if (!namespace || !/^[a-f0-9]{32}$/i.test(namespace.id || '')) {
              throw new Error('Cloudflare did not return a valid EDGE_KV namespace ID.');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'namespace_id=' + namespace.id + '\n');
            process.stdout.write('EDGE_KV namespace ready: ' + namespace.id + '\n');
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE

      - name: Build production Worker configuration
        env:
          EDGE_KV_NAMESPACE_ID: ${{ steps.kv.outputs.namespace_id }}
          CF_ACCESS_TEAM_DOMAIN: super-disk-6ad7.cloudflareaccess.com
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const required = ['EDGE_KV_NAMESPACE_ID', 'CF_ACCESS_TEAM_DOMAIN'];
          for (const key of required) {
            if (!process.env[key]) throw new Error('Missing GitHub Actions secret/configuration: ' + key);
          }
          const accessAud = String(process.env.CF_ACCESS_AUD || '').trim();
          if (!accessAud || accessAud === 'EDGE_ACCESS_BOOTSTRAP_PENDING' || accessAud.length > 256) {
            throw new Error('CF_ACCESS_AUD is missing or invalid. Configure the Cloudflare Access application first, then save its AUD as the GitHub Actions secret CF_ACCESS_AUD.');
          }
          if (!/^[a-z0-9-]+\.cloudflareaccess\.com$/i.test(process.env.CF_ACCESS_TEAM_DOMAIN)) {
            throw new Error('CF_ACCESS_TEAM_DOMAIN must be your Cloudflare Access team domain.');
          }
          const source = fs.readFileSync('wrangler.toml', 'utf8');
          const production = source.split('[env.staging]')[0]
            .replace('https://REPLACE_WITH_YOUR_PAGES_DOMAIN', 'https://ttamlarson.github.io')
            .replace('REPLACE_WITH_YOUR_TEAM.cloudflareaccess.com', process.env.CF_ACCESS_TEAM_DOMAIN)
            .replace('REPLACE_WITH_ACCESS_APPLICATION_AUD', accessAud)
            .replace('REPLACE_WITH_YOUR_KV_NAMESPACE_ID', process.env.EDGE_KV_NAMESPACE_ID);
          if (/REPLACE_WITH/.test(production)) throw new Error('A production configuration placeholder remains.');
          fs.writeFileSync('wrangler.deploy.toml', production);
          NODE

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3d6d1c93342d0a22c108dee320c2bf6e
        run: wrangler deploy --config wrangler.deploy.toml

      - name: Remove generated configuration
        if: always()
        run: rm -f wrangler.deploy.toml
