name: EDGE validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, edge-production-remediation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run check
      - run: npm run build:pages
