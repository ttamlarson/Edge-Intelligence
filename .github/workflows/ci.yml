name: EDGE CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run deterministic tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build static Pages output
        run: npm run build:pages
      - name: Verify ASX paper engine is included
        run: test -f dist/autonomous-engine.js
      - name: Upload deployable static site
        uses: actions/upload-artifact@v4
        with:
          name: edge-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
